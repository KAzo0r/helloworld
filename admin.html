<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора | Tashkent Innovates</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f0ff;
            --bg-dark: #0a0a0f;
            --bg-card: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-main: 'Outfit', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 40px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--primary);
        }

        .stats {
            display: flex;
            gap: 20px;
        }

        .stat-badge {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--primary);
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--glass-border);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .track-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .track-virtual {
            background: rgba(255, 0, 85, 0.2);
            color: #ff0055;
            border: 1px solid #ff0055;
        }

        .track-smart {
            background: rgba(0, 240, 255, 0.2);
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .nav-back {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s;
        }

        .nav-back:hover {
            color: var(--primary);
        }

    </style>
</head>
<body>

    <a href="index.html" class="nav-back">← Вернуться на главный сайт</a>

    <div class="admin-container">
        <div class="header">
            <h1>Заявки платформы</h1>
            <div class="stats">
                <div class="stat-badge">Всего заявок: <span id="total-count">0</span></div>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя / Команда</th>
                    <th>Email</th>
                    <th>Трек</th>
                    <th>Время регистрации</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td colspan="5" style="text-align: center; color: var(--text-muted);">Загрузка данных...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('http://localhost:8000/api/registrations');
                const data = await response.json();
                
                const tbody = document.getElementById('table-body');
                document.getElementById('total-count').textContent = data.length;
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Пока нет ни одной заявки</td></tr>';
                    return;
                }

                tbody.innerHTML = '';
                
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    
                    const trackClass = row.track === 'virtual' ? 'track-virtual' : 'track-smart';
                    const trackName = row.track === 'virtual' ? 'Virtual Tashkent' : 'Smart Tashkent';
                    
                    const date = new Date(row.timestamp).toLocaleString('ru-RU');

                    tr.innerHTML = `
                        <td>#${row.id}</td>
                        <td style="font-weight: 600;">${row.name}</td>
                        <td>${row.email}</td>
                        <td><span class="track-badge ${trackClass}">${trackName}</span></td>
                        <td style="color: var(--text-muted);">${date}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('table-body').innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ff0055;">Ошибка подключения к серверу бэкенда</td></tr>';
            }
        }

        loadData();
    </script>
</body>
</html>
